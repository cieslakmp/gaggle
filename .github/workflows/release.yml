name: Release

on:
  push:
    tags: ['v*']

# Needed to create the release and upload the artifact.
permissions:
  contents: write

jobs:
  release:
    # Same constraint as CI: net10.0-windows and WinForms only build on Windows.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Full history and tags, so the annotated tag message can be read back
          # and used as the release notes.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Releasing $tag as version $version"

      - name: Restore
        run: dotnet restore

      # The version comes from the tag, not from the csproj, so a release cannot be
      # stamped with a number that disagrees with the tag it was built from. It also
      # means a release needs no commit of its own: tag, push, done.
      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # The injection above fails silently: a mistyped property name simply leaves the
      # csproj placeholder in place, and the zip ships stamped 0.0.0 - no release at
      # all - with nothing in the log to say so. Read it back off the assembly.
      - name: Check the build was stamped with the tag version
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $dll = "src/Gaggle/bin/Release/net10.0-windows/Gaggle.dll"
          if (-not (Test-Path $dll)) { throw "Build output missing: $dll" }

          # ProductVersion is the informational version, which the SDK may suffix with
          # "+<commit>".
          $stamped = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll)).ProductVersion
          if ($stamped -notmatch "^$([regex]::Escape($expected))(\+|$)") {
            throw "Tag is $expected but the build is stamped $stamped."
          }
          Write-Output "Build stamped $stamped"

      # A release must never ship code that fails its own tests.
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish
        run: dotnet publish src/Gaggle/Gaggle.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Package
        id: package
        shell: pwsh
        run: |
          if (-not (Test-Path publish/Gaggle.exe)) { throw "Gaggle.exe missing from publish output" }
          if (-not (Test-Path publish/runtimes/win-x64/whisper.dll)) { throw "whisper native libraries missing from publish output" }

          # Two things depend on this name and neither will complain if it changes.
          #
          # The in-app updater finds its assets by suffix - "-win-x64.zip" and
          # "-win-x64.zip.sha256" - so every copy already installed breaks if the suffix
          # goes. See src/Gaggle/Update/GitHubReleases.cs.
          #
          # And the name carries no version on purpose, because that is what makes
          # github.com/cieslakmp/gaggle/releases/latest/download/Gaggle-win-x64.zip work:
          # GitHub resolves that path against the newest release only for an asset named
          # exactly this. It is the download link on the site and the one link handed to
          # people, so a version in here would break it on the day it was published.
          #
          # Never publish a second asset ending in "-win-x64.zip" either: the updater
          # takes the last suffix match it sees, and which one that is comes down to the
          # order the API returns them in.
          $name = "Gaggle-win-x64.zip"

          # Ship the executable and the native runtimes only; the pdb is noise for users.
          Compress-Archive -Path publish/Gaggle.exe, publish/runtimes -DestinationPath $name -CompressionLevel Optimal

          # The updater verifies this before it extracts anything over a working install.
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.sha256" -Value "$hash  $name" -Encoding ascii

          "name=$name" >> $env:GITHUB_OUTPUT
          "checksum=$name.sha256" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Output ("{0} is {1:N1} MB" -f $name, ((Get-Item $name).Length / 1MB))
          Write-Output "SHA256 $hash"

      - name: Write release notes from the tag message
        id: notes
        shell: pwsh
        run: |
          # An annotated tag carries its own changelog; fall back to generated
          # notes for a lightweight tag.
          #
          # git returns multi-line output as an array of lines, so each part is
          # joined back into a string before use; interpolating the array directly
          # yields the literal text "System.Object[]".
          $tag = "${{ steps.version.outputs.tag }}"
          $subject = (git tag -l --format='%(contents:subject)' $tag) -join "`n"
          $body = (git tag -l --format='%(contents:body)' $tag) -join "`n"
          $text = (@($subject, "", $body) -join "`n").Trim()

          if ([string]::IsNullOrWhiteSpace($text)) {
            "generate=true" >> $env:GITHUB_OUTPUT
            Write-Output "Lightweight tag; letting GitHub generate the notes"
          } else {
            # So the checksum can be checked by hand as well as by the updater.
            $text = $text + "`n`n---`n`nSHA256 of ``${{ steps.package.outputs.name }}``:`n`n    ${{ steps.package.outputs.sha256 }}"

            Set-Content -Path release-notes.md -Value $text -Encoding utf8
            "generate=false" >> $env:GITHUB_OUTPUT
            Write-Output "Using the annotated tag message"
          }

      # Created as a draft on purpose: the notes come from a tag message, and a
      # release is public and permanent. Review, then publish.
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $args = @(
            "release", "create", "${{ steps.version.outputs.tag }}",
            "--draft",
            "--title", "Gaggle ${{ steps.version.outputs.version }}",
            "${{ steps.package.outputs.name }}#Gaggle ${{ steps.version.outputs.version }} (Windows x64)",
            "${{ steps.package.outputs.checksum }}#SHA256 checksum"
          )

          if ("${{ steps.notes.outputs.generate }}" -eq "true") {
            $args += "--generate-notes"
          } else {
            $args += @("--notes-file", "release-notes.md")
          }

          gh @args

      - name: Summary
        shell: pwsh
        run: |
          "### Draft release ${{ steps.version.outputs.tag }} created" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Asset: ``${{ steps.package.outputs.name }}``" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "SHA256: ``${{ steps.package.outputs.sha256 }}``" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Review the notes, then publish it from the Releases page." >> $env:GITHUB_STEP_SUMMARY
